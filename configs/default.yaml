# Autoresearch Idea Harness — default configuration.
#
# Path resolution (see src/autoresearch_idea_harness/io.py:load_config):
#   * Relative paths are resolved against the repository root.
#   * `~` and `${ENV_VAR}` references are expanded.
# Sections marked "INTERNAL" refer to infrastructure that only exists inside
# the original lab environment; they are not needed for external reproduction
# (see REPRODUCE.md).

project_root: .
repo_root: ..
# Sibling checkout of the proposal_rl repo (cross-repo dependency: SFT training
# code lives at proposal_rl/train/sft.py — see REPRODUCE.md).
proposal_rl_root: ../proposal_rl
# External benchmark checkouts / data. Clone or symlink them here, or replace
# with absolute paths (env expansion is supported, e.g. ${MLS_BENCH_ROOT}).
mls_bench_root: external/MLS-Bench
mle_data_dir: external/mlebench_data
# Python interpreter used to run benchmark training scripts.
# null -> defaults to the current interpreter (sys.executable); can also be
# overridden with the MLE_PYTHON environment variable.
benchmark_python: null

# arXiv-derived inputs. Place (or symlink) your data under data/, or point
# these at absolute locations.
classified_papers: data/arxiv_tex_classified/v1/papers.jsonl
dataset_dir: data/dataset          # {train,val,test}.jsonl paper records
arxiv_root: data/arxiv/papers      # raw paper TeX sources
runs_dir: runs
scan_arxiv_metadata: false

base_models:
  # Local directories scanned by scripts/discover_v3_base_models.py.
  # Set MODEL_DIR to your HuggingFace snapshot root, or list paths here.
  search_roots:
    - models
  # Each entry should include:
  #   hf_id: HuggingFace hub id (used when no local path is given)
  #   path: optional absolute local snapshot path; when omitted the model is
  #         resolved as ${MODEL_DIR}/<hf_id> if MODEL_DIR is set, else the hub
  #         id itself (transformers will download from the hub).
  #   release_date: YYYY-MM-DD (required for leakage-safe training)
  #   size_b: 32
  #   smoke_only: false
  registry:
    qwen25_32b_instruct:
      hf_id: Qwen/Qwen2.5-32B-Instruct
      name: Qwen2.5-32B-Instruct
      release_date: 2024-09-19
      release_date_source: https://qwenlm.github.io/blog/qwen2.5/
      size_b: 32.5
      smoke_only: false

llm:
  # INTERNAL: base URL of the lab's Runway LLM proxy. Leave null externally;
  # the public path uses the standard Anthropic API (ANTHROPIC_API_KEY).
  # May also be supplied via the RUNWAY_BASE_URL environment variable.
  runway_base_url: null
  chat_api_version: 2024-12-01-preview
  timeout: 300
  proposal_temperature: 0.7
  proposal_max_tokens: 2600
  expert_temperature: 0.2
  expert_max_tokens: 1600

paper_bank:
  splits: [train, val, test]
  max_ref_tex_chars: 12000
  max_snippets_per_ref: 4
  snippet_char_limit: 1800

evidence_packets:
  version: v1
  route: tex_target_with_ref_detail
  paper_types: [method_algorithm, system_tooling]
  top_k_refs: 5
  min_refs: 1
  require_ref_tex: true
  min_ref_tex_snippets: 1
  max_ref_snippets_per_packet: 12
  default_limit: 100

training_manifest:
  version: v3_0_manifest
  paper_types: [method_algorithm]
  training_routes: [tex_target_with_ref_detail]
  detail_support_levels: [tex_good, tex_rich]
  category_families: [ml, vision, ai]
  categories: [cs.LG, cs.CV, cs.AI, stat.ML, eess.IV]
  required_tex_features: [has_method, has_implementation, has_evaluation]
  min_refs: 3
  top_k_refs: 5
  reference_abstract_tokens: 200
  reference_abstract_chars: 700
  require_research_question: true
  min_quality_score: 4.0
  train_ratio: 0.8
  val_ratio: 0.1

# INTERNAL: TeX-grounded target synthesis was run through the internal Runway
# proxy (Anthropic models behind a lab gateway). Externally, use the released
# V2 dataset instead of re-running this step (see REPRODUCE.md).
target_synthesis:
  provider: runway_google_anthropic
  endpoint: google_anthropic
  key_env: RUNWAY_OPUS47_API_KEY
  model: claude-opus-4-7
  prompt_version: v3_strict
  max_tokens: 8192
  temperature: null
  concurrency: 2
  max_tex_chars: 24000
  chunk_timeout: 180.0
  call_timeout: 420.0
  require_all_target_tags: true

sft_collate:
  include_cot: false

v3_training:
  sft:
    torchrun_bin: torchrun
    finetune_mode: lora
    num_train_epochs: 1
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 1.0e-5
    warmup_ratio: 0.03
    max_seq_length: 8192
    save_steps: 200
    lora_r: 64
    lora_alpha: 128
  policy:
    curriculum: chronological_month
    sft_fraction_first_cycle: 0.7
    rl_or_preference_fraction_first_cycle: 0.3
    ability_preservation: low_lr_lora_first_then_regression_checked_full_or_adapter_tuning
  # INTERNAL: Alibaba PAI-DLC submission settings for the lab cluster. Not
  # needed externally — run the generated run_sft_curriculum.sh directly with
  # torchrun on your own multi-GPU node (see REPRODUCE.md). The values below
  # are placeholders.
  dlc:
    endpoint: pai-dlc.<region>.aliyuncs.com
    workspace_id: "<workspace-id>"
    resource_id: <quota-id>
    image: <registry>/<training-image>:<tag>
    gpus: 8
    cpus: 100
    memory: 1000Gi
    shared_memory: 1000Gi
    max_running_minutes: 720
    priority: 6
    enable_rdma: true
    data_sources:
      - id: <datasource-id>
        mount: /mnt/data
        version: v1
        access: RW

proposal_batches:
  proposals_per_packet: 4
  generators:
    - runway_opus47_proposal
  # INTERNAL: generator entries below route through the Runway proxy. External
  # users should use the `claude` generator (standard Anthropic API) instead.
  runway_generators:
    runway_opus47_proposal:
      key_env: RUNWAY_OPUS47_API_KEY
      model_env: RUNWAY_OPUS47_MODEL
      model: claude-opus-4-7
      endpoint: google_anthropic
      temperature: null
      max_tokens: 2600
    runway_opus48_proposal:
      key_env: RUNWAY_OPUS48_API_KEY
      model_env: RUNWAY_OPUS48_MODEL
      model: claude-opus-4-8
      endpoint: google_anthropic
      temperature: null
      max_tokens: 2600

market:
  success_definition: >
    Probability that, if implemented by a competent worker, this proposal would
    exceed the stated baseline or produce a clear measurable improvement on the
    relevant task/metric.
  llm_experts:
    - id: opus47
      key_env: RUNWAY_OPUS47_API_KEY
      model_env: RUNWAY_OPUS47_MODEL
      model: claude-opus-4-7
      endpoint: google_anthropic
      temperature: null
      max_tokens: 1600
    - id: gpt55
      key_env: RUNWAY_GPT55_API_KEY
      model_env: RUNWAY_GPT55_MODEL
      model: gpt-5.5
      endpoint: responses
      temperature: null
      max_tokens: 1600

end_to_end:
  gate_threshold: 0.5
  default_task: dl_activation_function
  default_subtask: resnet20-cifar10
  default_n_proposals: 3
  default_experts: [opus47, gpt55]
  # Command used to invoke the Claude Code CLI worker. Overridable with the
  # CLAUDE_CMD environment variable; defaults to `claude` on PATH.
  claude_cmd: claude
  worker_timeout: 7200
  max_turns: 30
  max_master_advice: 1

v2_3:
  formal_sweep_root: runs/formal_sweeps/v2_3_mls10_modules9
  tasks:
    - dl_lr_schedule
    - dl_activation_function
    - cv_data_augmentation
    - dl_weight_initialization
    - cv_classification_loss
    - cv_sample_weighting
    - cv_pooling_aggregation
    - cv_multitask_loss
    - dl_regularization
    - dl_residual_connection
  modules:
    - empty_worker_only
    - opus47_master
    - qwen25_7b_base_with_research_question
    - exp09_top_k_related_work
    - exp11_top_k_related_work
    - exp12_with_research_question
    - exp13_top_k_refs
    - exp16_top_k_refs
    - exp17_with_research_question
  task_thresholds:
    dl_lr_schedule:
      resnet20-cifar10:
        baseline_metric: 92.71
        pass_metric: 93.19
        source: redoc_260605_worker_only_best
    dl_activation_function:
      resnet20-cifar10:
        baseline_metric: 92.97
        pass_metric: 93.35
        source: redoc_260605_worker_only_best
    cv_data_augmentation:
      resnet20-cifar10:
        baseline_metric: 93.67
        pass_metric: 93.76
        source: redoc_260605_worker_only_best
