project_root: /newcpfs/lxh/agentic-training/autoresearch_idea_harness
repo_root: /newcpfs/lxh/agentic-training
proposal_rl_root: /newcpfs/lxh/agentic-training/proposal_rl
mls_bench_root: /newcpfs/lxh/MLS-Bench
mle_data_dir: /newcpfs/lxh/LoongFlow/output/mlebench
benchmark_python: /newcpfs/lxh/miniconda3/envs/loongflow_ml/bin/python

classified_papers: /newcpfs/lxh/agentic-training/data/arxiv_tex_classified/v1/papers.jsonl
dataset_dir: /newcpfs/lxh/agentic-training/proposal_rl/runs/dataset
arxiv_root: /newcpfs/lxh/agentic-training/data/arxiv/papers
runs_dir: /newcpfs/lxh/agentic-training/autoresearch_idea_harness/runs
scan_arxiv_metadata: false

base_models:
  search_roots:
    - /newcpfs/lxh/agentic-training/proposal_rl/runs/model_cache
    - /newcpfs/user/yuanqianhao/hf_models
    - /newcpfs/user/gaochaochen/huimu/CodePrMP/models
  # Fill this before formal V3 training. Each entry should include:
  #   path: /absolute/hf/model/path
  #   release_date: YYYY-MM-DD
  #   size_b: 32
  #   smoke_only: false
  registry:
    qwen25_32b_instruct:
      path: /newcpfs/user/yuanqianhao/hf_models/Qwen/Qwen2.5-32B-Instruct
      hf_id: Qwen/Qwen2.5-32B-Instruct
      name: Qwen2.5-32B-Instruct
      release_date: 2024-09-19
      release_date_source: https://qwenlm.github.io/blog/qwen2.5/
      size_b: 32.5
      smoke_only: false

llm:
  runway_base_url: https://runway.devops.rednote.life
  chat_api_version: 2024-12-01-preview
  timeout: 300
  proposal_temperature: 0.7
  proposal_max_tokens: 2600
  expert_temperature: 0.2
  expert_max_tokens: 1600

paper_bank:
  splits: [train, val, test]
  max_ref_tex_chars: 12000
  max_snippets_per_ref: 4
  snippet_char_limit: 1800

evidence_packets:
  version: v1
  route: tex_target_with_ref_detail
  paper_types: [method_algorithm, system_tooling]
  top_k_refs: 5
  min_refs: 1
  require_ref_tex: true
  min_ref_tex_snippets: 1
  max_ref_snippets_per_packet: 12
  default_limit: 100

training_manifest:
  version: v3_0_manifest
  paper_types: [method_algorithm]
  training_routes: [tex_target_with_ref_detail]
  detail_support_levels: [tex_good, tex_rich]
  category_families: [ml, vision, ai]
  categories: [cs.LG, cs.CV, cs.AI, stat.ML, eess.IV]
  required_tex_features: [has_method, has_implementation, has_evaluation]
  min_refs: 3
  top_k_refs: 5
  reference_abstract_tokens: 200
  reference_abstract_chars: 700
  require_research_question: true
  min_quality_score: 4.0
  train_ratio: 0.8
  val_ratio: 0.1

target_synthesis:
  provider: runway_google_anthropic
  endpoint: google_anthropic
  key_env: RUNWAY_OPUS47_API_KEY
  model: claude-opus-4-7
  prompt_version: v3_strict
  max_tokens: 8192
  temperature: null
  concurrency: 2
  max_tex_chars: 24000
  chunk_timeout: 180.0
  call_timeout: 420.0
  require_all_target_tags: true

sft_collate:
  include_cot: false

v3_training:
  sft:
    torchrun_bin: /newcpfs/lxh/miniconda3/envs/loongflow_ml/bin/torchrun
    finetune_mode: lora
    num_train_epochs: 1
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 1.0e-5
    warmup_ratio: 0.03
    max_seq_length: 8192
    save_steps: 200
    lora_r: 64
    lora_alpha: 128
  policy:
    curriculum: chronological_month
    sft_fraction_first_cycle: 0.7
    rl_or_preference_fraction_first_cycle: 0.3
    ability_preservation: low_lr_lora_first_then_regression_checked_full_or_adapter_tuning
  dlc:
    endpoint: pai-dlc.ap-southeast-1.aliyuncs.com
    workspace_id: "262162"
    resource_id: quota1shcr2h7uae
    image: ali-sg-acr-registry-vpc.ap-southeast-1.cr.aliyuncs.com/xhs-llm/guangsu:ngc2506_te2.8_h100_v3
    gpus: 8
    cpus: 100
    memory: 1000Gi
    shared_memory: 1000Gi
    max_running_minutes: 720
    priority: 6
    enable_rdma: true
    data_sources:
      - id: d-s5sllzhztbq48bhexm
        mount: /newcpfs
        version: v1
        access: RW
  qs:
    queue_id: 532
    queue_name: research_agent
    cloud_id: 12
    cloud_name: 小红书-JP
    cluster_id: 70
    resource_package_id: 234
    resource_package_name: 4Gpu/140C/900Gi
    worker_num: 1
    priority: 0
    overuse: false
    job_type: PytorchJob
    image: artifactory.devops.xiaohongshu.com/quicksilver/images/training/media/nvidia/tutu_cybertron:ngc2510_xray_newep_3fs_v1
    remote_project_root: /mnt/3fs/lxh/agentic-training
    remote_harness_root: /mnt/3fs/lxh/agentic-training/autoresearch_idea_harness
    remote_run_root: /mnt/3fs/lxh/agentic-training/autoresearch_idea_harness/runs/qs
    remote_code_smoke_root: /mnt/3fs/lxh/agentic-training/code_smoke
    smoke_sleep_seconds: 60
    git_repos:
      - name: autoresearch_idea_harness
        url: https://github.com/XinghanLi66/autoresearch_idea_harness.git
        ref: opensource-v2
        compile_check: src/autoresearch_idea_harness/io.py
      - name: proposal_rl
        url: https://github.com/XinghanLi66/proposal_rl.git
        ref: opensource-prep
        compile_check: train/sft.py

proposal_batches:
  proposals_per_packet: 4
  generators:
    - runway_opus47_proposal
  runway_generators:
    runway_opus47_proposal:
      key_env: RUNWAY_OPUS47_API_KEY
      model_env: RUNWAY_OPUS47_MODEL
      model: claude-opus-4-7
      endpoint: google_anthropic
      temperature: null
      max_tokens: 2600
    runway_opus48_proposal:
      key_env: RUNWAY_OPUS48_API_KEY
      model_env: RUNWAY_OPUS48_MODEL
      model: claude-opus-4-8
      endpoint: google_anthropic
      temperature: null
      max_tokens: 2600

market:
  success_definition: >
    Probability that, if implemented by a competent worker, this proposal would
    exceed the stated baseline or produce a clear measurable improvement on the
    relevant task/metric.
  llm_experts:
    - id: opus47
      key_env: RUNWAY_OPUS47_API_KEY
      model_env: RUNWAY_OPUS47_MODEL
      model: claude-opus-4-7
      endpoint: google_anthropic
      temperature: null
      max_tokens: 1600
    - id: gpt55
      key_env: RUNWAY_GPT55_API_KEY
      model_env: RUNWAY_GPT55_MODEL
      model: gpt-5.5
      endpoint: responses
      temperature: null
      max_tokens: 1600

end_to_end:
  gate_threshold: 0.5
  default_task: dl_activation_function
  default_subtask: resnet20-cifar10
  default_n_proposals: 3
  default_experts: [opus47, gpt55]
  claude_cmd: /newcpfs/lxh/claude-home-agent1/run_claude.sh
  worker_timeout: 7200
  max_turns: 30
  max_master_advice: 1

v2_3:
  formal_sweep_root: /newcpfs/lxh/agentic-training/autoresearch_idea_harness/runs/formal_sweeps/v2_3_mls10_modules9
  tasks:
    - dl_lr_schedule
    - dl_activation_function
    - cv_data_augmentation
    - dl_weight_initialization
    - cv_classification_loss
    - cv_sample_weighting
    - cv_pooling_aggregation
    - cv_multitask_loss
    - dl_regularization
    - dl_residual_connection
  modules:
    - empty_worker_only
    - opus47_master
    - qwen25_7b_base_with_research_question
    - exp09_top_k_related_work
    - exp11_top_k_related_work
    - exp12_with_research_question
    - exp13_top_k_refs
    - exp16_top_k_refs
    - exp17_with_research_question
  task_thresholds:
    dl_lr_schedule:
      resnet20-cifar10:
        baseline_metric: 92.71
        pass_metric: 93.19
        source: redoc_260605_worker_only_best
    dl_activation_function:
      resnet20-cifar10:
        baseline_metric: 92.97
        pass_metric: 93.35
        source: redoc_260605_worker_only_best
    cv_data_augmentation:
      resnet20-cifar10:
        baseline_metric: 93.67
        pass_metric: 93.76
        source: redoc_260605_worker_only_best
