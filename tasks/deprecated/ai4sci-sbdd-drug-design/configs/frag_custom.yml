model:
  type: custom
  encoder:
    type: unitransformer
    node_feat_dim: 128
    n_heads: 16
    num_layers: 9
  generator:
    pos_schedule:
      type: sigmoid
      beta_start: 1.e-7
      beta_end: 2.e-3
    atom_schedule:
      type: cosine
      cosine_s: 0.01
    num_diffusion_timesteps: 1000
    time_sampler: symmetric
  embedder:
    emb_dim: 128
    atom:
      type: linear
    residue:
      type: linear

data:
  train:
    name: pl_decomp
    version: frag
    raw_path: /data/crossdocked/crossdocked_v1.1_rmsd1.0_pocket10
    processed_dir: /data/crossdocked/pl_decomp/
    split_path: /data/crossdocked/split_by_name_10m.pt
    transform:
      - type: choose_ctx_gen
      - type: featurize_protein_fa
      - type: featurize_ligand_fa
        mode: add_aromatic
      - type: add_pos_noise
        noise_std: 0.1
      - type: center_pos
        center_flag: ligand
        mask_flag: ctx_flag
      - type: merge
        keys:
          - protein
          - ligand
  follow_batch:
    - protein_element
    - ligand_element

train:
  loss_weights:
    pos: 1.0
    atom: 100.0
    focal: 1.0
    com: 1.0
    inter: 0.5
  max_iters: 5000000
  report_freq: 1000
  batch_size: 4
  seed: 2022
  max_grad_norm: 8.0
  optimizer:
    type: adam
    lr: 5.e-4
    weight_decay: 0.0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.e-6

eval:
  val_freq: 5000
  metrics:
    - name: auroc
      true_key: v0
      pred_key: c_pred
      mask_key: mask_gen
